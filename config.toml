# gEmuera 运行时诊断配置
#
# 企业级说明：
# 1. 本文件替代旧版 JSON 配置，是 Godot 壳层日志、诊断导出、触摸追踪、图片追踪和 UI 几何追踪的统一入口。
# 2. 默认值面向 Android/APK 实机游玩：高频调试全部关闭，只保留 Error 级别日志，避免触摸、滚动、图片加载和脚本执行路径产生额外 GC 与帧尖峰。
# 3. 开启诊断时建议只打开正在排查的最小模块；不要一次性打开 touch、ui_layout、image、statement_recognition 的全部子项。
# 4. 诊断日志优先保存在内存 ring buffer 中，悬浮窗 GDPrint 页可直接查看；只有手动点击导出日志/诊断包时才写入启动游戏目录，避免移动端游玩期持续写盘。
# 5. game:// 表示本次启动的游戏目录；运行时调试界面会显示解析后的实际绝对路径。
# 6. 所有路径、脚本文本、用户输入文本都经过截断/脱敏配置控制，默认不记录完整隐私路径和完整输入内容。

# 当前启用的语言/环境配置。可选值：debug_model_zh_cn、debug_model_jp、debug_model_en。
# 注意：active_debug_model 是 TOML 根字段，必须位于第一个 section 之前；custom 模式会按它选择专家配置档。
active_debug_model = "debug_model_zh_cn"

# 人用简化入口：日常 APK 调试优先只改这里，不需要理解下方全部专家细项。
# preset 可选：normal / touch_input / image_ui / resource_storage / performance / apk_issue / custom。
# custom 表示完全按下方 [debug.*] 专家细项执行。
[quick_debug]
enabled = true
preset = "normal"
language = "zh_cn"
apk_safe = true
mirror_non_error_to_godot = false
runtime_panel = false
diagnostic_package = true

# 这些是 preset 之外的额外开启项；false 表示不额外开启，不反向关闭 preset 已开启项。
[quick_debug.modules]
touch = false
input = false
image = false
ui_layout = false
resource = false
load_save = false
android_storage = true
performance_sampling = false
snapshot = false
input_replay = false

[debug_model_zh_cn]
# 中文诊断档。APK 默认关闭，临时排查时改为 true，并按下方模块开关精确开启。
enabled = false
language = "zh_cn"
log_level = "error"
mirror_to_godot = false
scroll_trace = false

[debug_model_jp]
# 日文诊断档。用于对照日文资源或前辈模拟器行为时切换，不建议作为 APK 默认配置。
enabled = false
language = "jp"
log_level = "debug"
mirror_to_godot = true
scroll_trace = false

[debug_model_en]
# 英文诊断档。用于生成英文问题报告或给外部工具分析时切换。
enabled = false
language = "en"
log_level = "debug"
mirror_to_godot = true
scroll_trace = false

[logging]
# 全局最低日志等级。APK 推荐 error；需要完整诊断时再改为 debug。
level = "error"
# false 表示非 Error 日志只进入诊断系统，不镜像到 Godot 控制台，避免控制台刷屏拖慢移动端。
mirror_non_error_to_godot = false
# 内存环形日志容量。容量越大越利于回溯，但会占用更多内存；手机默认 1000 条足够定位多数问题。
diagnostic_ring_capacity = 1000
# 单条 message 的最大长度，防止异常长文本撑爆日志。
max_message_chars = 8192
# 手动导出诊断文件的默认目录。game:// 表示本次启动的游戏目录；实际绝对路径请看调试界面 GDPrint 页。
export_directory = "game://"
schema_version = 1
session_id_format = "yyyyMMdd-HHmmss"

[logging.categories]
# 一级日志类别开关。只有 debug_model 启用后，这些类别才会参与 Debug/Info/Warn 级别输出。
general = true
sprite = true
audio = true
input = true
script = true
ui = true
file_system = true
load = true
save = true
config = true
performance = true
# 高频移动端触摸日志默认关闭；排查点击、拖动、缩放时再开启。
touch = false
# ERB/表达式识别日志默认关闭；该类日志可能非常密集，需按问题范围单独开启。
statement_recognition = false

[logging.correlation]
# 关联字段用于把输入、渲染批次、行片段、图片加载事件串起来，方便人与 AI 复盘。
enabled = true
session_id = true
input_id = true
render_batch_id = true
line_part_id = true
image_id = true

[logging.rate_limit]
# 高频日志限流。除非正在做极短时本地复现，不建议关闭。
enabled = true
default_per_second = 240
default_per_frame = 64
per_event_per_second = 30
record_dropped_count = true

[logging.redaction]
# 脱敏策略。默认只保留必要定位信息，避免诊断包暴露完整路径、脚本文本和用户输入。
enabled = true
normalize_paths = true
path_mode = "basename_and_root"
max_path_chars = 160
max_script_text_chars = 120
max_user_text_chars = 64
replace_newlines = true
hash_sensitive_text = false

[debug.touch]
# 触摸诊断。用于排查手机点击、拖动、双指缩放、惯性滚动问题。
# 使用建议：先 enabled=true，再只打开 pointer/drag/pinch/inertia 中需要的一项。
enabled = false
pointer = false
drag = false
pinch = false
inertia = false
scroll = false
drag_interval_ms = 120
core_burst_line_count = 120

[debug.statement_recognition]
# ERB/语句识别诊断。默认关闭，避免脚本执行热路径产生大量日志。
# 未明确定位到解析/识别问题前，不建议开启 expression、variable、function_call。
enabled = false
erb_load = false
logical_line = false
expression = false
variable = false
function_call = false
max_lines_per_burst = 80

[debug.input]
# 输入链路诊断。用于确认按钮、键盘、触摸转换后的输入是否提交/消费。
enabled = false
submit = false
consume = false
button = false

[debug.performance]
# 性能诊断。用于启动耗时、UI 队列、资源加载的低频定位。
enabled = false
startup_timing = true
ui_queue = false
resource_loading = false

[debug.load]
# 加载流程诊断。用于 ERB/CSV/资源加载阶段定位，不修改加载策略。
enabled = false
erb = false
csv = false
resources = false

[debug.save]
# 存档读写诊断。默认关闭，避免正常游玩时记录过多 I/O 信息。
enabled = false
read = false
write = false
compatibility_fallback = false

[debug.resource]
# 资源层诊断。用于 sprite/audio/sqlite 等资源定位，不改变缓存策略。
enabled = false
sprite = false
audio = false
sqlite = false

[debug.image]
# 图片诊断。用于排查图片路径解析、纹理解码、渲染目标矩形、缓存命中和色彩矩阵问题。
# 移动端建议优先打开 resolve 或 texture；log_success 会记录成功加载，日志量较大，默认关闭。
enabled = false
resolve = false
texture = false
render_rect = false
cache = false
color_matrix = false
log_success = false
max_records_per_frame = 16

[debug.ui_layout]
# UI 几何诊断。用于对比 ERB/UI 语法的目标位置与 EmueraContent 中 Godot Control 的实际位置。
# 默认 mismatch_only=true，只在差异超过 mismatch_threshold_px 时记录，避免每个按钮/图片都刷日志。
enabled = false
target_rect = false
actual_rect = false
mismatch_only = true
mismatch_threshold_px = 2
text = false
button = true
image = true
shape = true
html_div = true
html_img = true
cbg = true
include_text = false
max_text_chars = 32
max_records_per_frame = 32

[debug.lifecycle]
# 生命周期诊断。后续可用于 Android pause/resume、后台恢复、窗口尺寸变化等移动端问题。
enabled = false
android_pause_resume = false

[debug.runtime_panel]
# 运行时诊断面板预留配置。persist_changes=false 表示运行时改动不写回配置，避免误污染 APK 默认配置。
enabled = false
allow_runtime_toggle = true
persist_changes = false
show_active_modules = true
show_ring_buffer_stats = true

[diagnostic_package]
# 诊断包导出内容。建议保持开启，出现用户现场问题时可一次性导出日志、配置快照、设备和屏幕信息。
enabled = true
include_log = true
include_config_snapshot = true
include_device_info = true
include_screen_info = true
include_godot_info = true
include_apk_info = true
include_game_path = true
include_error_summary = true

[diagnostic_summary]
# 诊断摘要控制。top_* 数量越大，报告越详细；默认 20 便于人工和 AI 快速定位高频问题。
enabled = true
top_event_ids = 20
top_ui_layout_mismatches = 20
top_image_failures = 20

[debug.ui_overlay]
# UI 调试覆盖层预留配置。默认关闭，避免影响手机实际画面和触摸判定。
enabled = false
target_rect = false
actual_rect = false
mismatch = true
image_rect = true
button_rect = true
max_drawn_rects = 128

[debug.reference]
# 前辈模拟器对照诊断。用于标记当前日志是否来自 uEmuera/XEmuera 参考行为。
enabled = false
reference_name = ""
expected_from_reference = false
reference_note = false

[diagnostic_breadcrumb]
# 面包屑日志记录关键生命周期点，便于崩溃或无法导出完整日志时保留最小现场。
enabled = true
path = "game://gemuera-last-session-breadcrumb.log"
max_bytes = 32768
write_on_startup = true
write_on_config_loaded = true
write_on_game_path_selected = true
write_on_severe_error = true
write_on_export = true
write_on_shutdown = true

[debug.input_replay]
# 输入复现缓冲。只保存最近 N 条输入摘要，不保存完整用户文本。
enabled = false
max_events = 240
capture_touch = true
capture_button = true
capture_keyboard = true
capture_wait_state = true
capture_timing = true
max_text_chars = 32

[diagnostic_retention]
# 诊断文件保留策略，防止启动游戏目录下的 gEmuera 诊断文件无限增长。
enabled = true
directory = "game://"
max_packages = 20
max_total_mb = 128
cleanup_on_startup = true
cleanup_before_export = true
protect_current_session = true

[debug.android_storage]
# Android 存储诊断。默认开启低频错误/路径选择记录，用于定位 scoped storage 和游戏目录读取问题。
enabled = true
log_permissions = true
log_game_scan = true
log_path_selection = true
log_read_write_failures = true
log_scoped_storage = true
max_path_records = 64

[debug.performance_sampling]
# 性能采样。默认关闭；开启后按 sample_interval_ms 记录 FPS、帧时间、队列和内存摘要。
enabled = false
sample_interval_ms = 1000
include_fps = true
include_frame_ms = true
include_ui_queue = true
include_texture_queue = true
include_ring_buffer = true
include_dropped_count = true
include_memory = true

[diagnostic_snapshot]
# 现场快照预留配置。截图/布局快照可能增加文件体积和隐私风险，默认关闭。
enabled = false
include_screenshot = false
include_layout_snapshot = false
include_visible_ui_rects = true
include_image_rects = true
max_nodes = 512
max_file_kb = 1024
